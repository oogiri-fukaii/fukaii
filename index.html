<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>深イイ大喜利 判定</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
:root{
  --bg:#ebe8fb; --ink:#1d1850; --muted:#5d5893; --panel:#ffffff; --line:#cfc9f2;
  --stage:#17124d; --stage-ink:#f4f1ff; --gold:#ffc928; --gold-deep:#e89a00;
  --pink:#ff3d8b; --uun:#9a96c4; --uun-deep:#5c5890; --orange:#e8742a;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0d0a2c;--ink:#ecebff;--muted:#a6a2d8;--panel:#1b1650;--line:#2f2970;--stage:#1c165c}
}
:root[data-theme="dark"]{--bg:#0d0a2c;--ink:#ecebff;--muted:#a6a2d8;--panel:#1b1650;--line:#2f2970;--stage:#1c165c}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);
  font-family:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
[hidden]{display:none!important}
.disp{font-family:"Dela Gothic One","Hiragino Kaku Gothic StdN",sans-serif}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px}
.logo{font-size:20px;margin:0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.chip[aria-pressed="false"]{color:var(--muted);text-decoration:line-through}

.view{flex:1;min-height:0;display:flex;flex-direction:column}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.lead{margin:0;color:var(--muted);font-size:15px;max-width:34em;line-height:1.7}
.big{width:min(420px,100%);border:0;border-radius:18px;padding:18px;font-size:22px;background:var(--panel);border:2px solid var(--line)}
.big.primary{background:var(--gold);color:#3a1d00;border-color:var(--gold-deep)}

/* ステージ */
.stage{flex:1;min-height:160px;position:relative;overflow:hidden;margin:0 12px;border-radius:24px;background:var(--stage);color:var(--stage-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;transition:background .5s ease}
.round{position:absolute;top:12px;left:16px;font-size:15px;font-weight:700;background:rgba(255,255,255,.12);padding:4px 12px;border-radius:999px}
.result{position:relative;font-size:clamp(52px,14vw,170px);line-height:1.1;color:rgba(244,241,255,.35);text-align:center}
.sub{position:relative;margin:8px 0 0;font-size:clamp(15px,2.6vw,22px);font-weight:700;color:rgba(244,241,255,.75);text-align:center;padding:0 16px}
.fukai-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:0;pointer-events:none}
.stage.tame .result{color:var(--stage-ink);animation:pulse .35s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.94)}to{transform:scale(1.04)}}
.stage.fukai{background:var(--orange)}
.stage.fukai .fukai-img{opacity:1}
.stage.fukai.anim .fukai-img{animation:imgstamp .6s cubic-bezier(.2,1.5,.4,1) both}
.stage.fukai .result{display:none}
.stage.fukai .sub{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);margin:0;background:rgba(0,0,0,.65);color:#fff;padding:6px 16px;border-radius:999px;white-space:nowrap}
.stage.fukai .round{z-index:1;background:rgba(0,0,0,.45)}
@keyframes imgstamp{0%{transform:scale(1.8);opacity:0}100%{transform:scale(1);opacity:1}}
.stage.uun{background:#2a2750}
.stage.uun .result{color:var(--uun)}
.stage.uun.anim .result{animation:sag 1.2s ease-out both}
@keyframes sag{0%{transform:translateY(-40px);opacity:0}55%{transform:translateY(8px) rotate(-2deg);opacity:1}75%{transform:translateY(0) rotate(1.5deg)}100%{transform:translateY(4px)}}

/* 6人の席 */
.seats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:12px 12px 0}
@media (max-width:700px){.seats{grid-template-columns:repeat(3,1fr)}}
.seat{background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 8px;text-align:center;min-width:0}
.seat .no{font-size:12px;color:var(--muted);font-weight:700}
.seat .nm{font-weight:700;font-size:clamp(14px,2vw,18px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .st{margin-top:6px;font-size:clamp(14px,2.2vw,22px);min-height:1.4em}
.seat.done .st{color:var(--pink)}
.seat.empty{opacity:.5}
.seat.vf{background:var(--gold);border-color:var(--gold-deep);color:#3a1d00}
.seat.vu{background:var(--uun);border-color:var(--uun-deep);color:#1d1a45}
.seat.vf .no,.seat.vu .no{color:inherit;opacity:.7}
.seats.anim .seat.vf,.seats.anim .seat.vu{animation:flip .45s ease both}
.seats.anim .seat:nth-child(2){animation-delay:.08s}.seats.anim .seat:nth-child(3){animation-delay:.16s}
.seats.anim .seat:nth-child(4){animation-delay:.24s}.seats.anim .seat:nth-child(5){animation-delay:.32s}.seats.anim .seat:nth-child(6){animation-delay:.4s}
@keyframes flip{0%{transform:rotateX(90deg)}100%{transform:none}}

.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;padding:12px}
.go{border:0;border-radius:16px;padding:14px 28px;font-size:clamp(20px,3vw,28px);background:var(--pink);color:#fff;box-shadow:0 5px 0 #b3215c}
.go:disabled{opacity:.5;cursor:default}
.ctrl label{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.ctrl select{font:inherit;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--panel);color:inherit}
.note{margin:0;padding:0 16px 10px;text-align:center;font-size:13px;color:var(--muted)}

/* 投票側 */
.me{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 16px 8px;font-weight:700}
.vstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;margin:0 12px;border-radius:24px;background:var(--stage);color:var(--stage-ink);padding:16px;text-align:center}
.vstage .rn{font-size:clamp(28px,8vw,48px)}
.vstage p{margin:0;font-weight:700;color:rgba(244,241,255,.8)}
.vbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:12px}
.judge{border:0;border-radius:20px;min-height:clamp(110px,22vh,180px);font-size:clamp(30px,8vw,48px);transition:transform .08s ease,filter .2s ease;position:relative}
.judge.f{background:var(--gold);color:#3a1d00;box-shadow:0 6px 0 var(--gold-deep)}
.judge.u{background:var(--uun);color:#1d1a45;box-shadow:0 6px 0 var(--uun-deep)}
.judge[aria-pressed="true"]{outline:5px solid var(--pink);outline-offset:3px}
.judge[aria-pressed="false"].dim{filter:grayscale(.5) brightness(.8)}
.judge:disabled{cursor:default;filter:grayscale(.8) brightness(.7)}
.vstage.closed{background:#2a2750}
.seatpick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(480px,100%)}
.seatpick button{border:2px solid var(--line);background:var(--panel);border-radius:14px;padding:12px 6px;font-weight:700;min-width:0}
.seatpick button small{display:block;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seatpick button[aria-pressed="true"]{border-color:var(--pink);background:rgba(255,61,139,.12)}
.namein{width:min(480px,100%);font:inherit;font-size:18px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:inherit}
.warn{color:var(--pink);font-weight:700;margin:0;font-size:14px}

.qrwrap{position:fixed;inset:0;background:rgba(13,10,44,.8);display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}
.qrbox{background:#fff;color:#17124d;border-radius:24px;padding:20px;text-align:center;max-width:100%;max-height:100%;display:flex;flex-direction:column;align-items:center;gap:8px}
.qrbox p{margin:0;font-size:clamp(20px,4vw,32px)}
.qrbox .small{font-size:14px;color:#5d5893}
.qrbox img{width:min(70vh,80vw,520px);height:auto;image-rendering:pixelated}
.qrbox .chip{background:#ebe8fb;color:#17124d;border-color:#cfc9f2}
.uun-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center 40%;opacity:0;pointer-events:none}
.stage.uun{background:#1f4fc9}
.stage.uun .uun-img{opacity:1}
.stage.uun.anim .uun-img{animation:imgsag .9s ease-out both}
.stage.uun .result{display:none}
.stage.uun .sub{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);margin:0;background:rgba(0,0,0,.65);color:#fff;padding:6px 16px;border-radius:999px;white-space:nowrap}
.stage.uun .round{z-index:1;background:rgba(0,0,0,.45)}
@keyframes imgsag{0%{transform:translateY(-12%);opacity:0}60%{transform:translateY(2%);opacity:1}100%{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
body.display #hdr{display:none}
.stage .uun-img{display:block}
.startwrap{position:fixed;inset:0;background:rgba(13,10,44,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;z-index:20;color:#f4f1ff}
.startwrap .small{margin:0;font-size:14px;line-height:1.7;color:#cfc9f2}
.adm{flex:1;overflow-y:auto;padding:4px 12px 12px;display:flex;flex-direction:column;gap:12px;max-width:640px;width:100%;margin:0 auto}
.admcard{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.admcard h2{margin:0 0 8px;font-size:16px}
.admhead{display:flex;justify-content:space-between;align-items:center;font-size:22px}
.pill{font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.admcount{margin:8px 0 12px;font-size:15px;font-weight:700;color:var(--muted)}
.go.wide{width:100%}
.alist{list-style:none;margin:0;padding:0}
.alist li{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700}
.alist li:last-child{border-bottom:0}
.alist .s{color:var(--muted);font-weight:500}
.alist .s.ok{color:var(--pink);font-weight:700}
.arow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:700}
.arow:last-child{border-bottom:0}
.arow select{font:inherit;border:1px solid var(--line);border-radius:999px;padding:5px 10px;background:var(--panel);color:inherit}
</style>
</head>
<body>
<header id="hdr">
  <h1 class="logo disp">深イイ大喜利</h1>

  function ac(){
    if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
      ctx=new C();master=ctx.createGain();master.gain.value=.9;master.connect(ctx.destination);
      soft=ctx.createBiquadFilter();soft.type='lowpass';soft.frequency.value=1100;soft.connect(master);}
    if(ctx.state==='suspended')ctx.resume();
    Object.values(SND).forEach(load);return ctx;
  }
  function load(s){
    if(s.buf||s.loading||!ctx)return;s.loading=true;
    try{const bin=atob(s.src.split(',')[1]),arr=new Uint8Array(bin.length);
      for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
      ctx.decodeAudioData(arr.buffer,b=>{s.buf=b;},()=>{s.loading=false;});}catch(e){s.loading=false;}
  }
  function soundOn(){return game.sound&&ctx&&ctx.state!=='suspended';}
  function tone(f,st,d,type,g0,fEnd,bus){
    const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,st);
    if(fEnd)o.frequency.exponentialRampToValueAtTime(fEnd,st+d);
    g.gain.setValueAtTime(.0001,st);g.gain.exponentialRampToValueAtTime(g0,st+.02);g.gain.exponentialRampToValueAtTime(.0001,st+d);
    o.connect(g).connect(bus||master);o.start(st);o.stop(st+d+.05);
  }
  function play(name){
    if(!soundOn())return;const s=SND[name];
    if(s.buf){const b=ctx.createBufferSource();b.buffer=s.buf;b.connect(master);b.start();return;}
    const t=ctx.currentTime;
    if(name==='fukai'){[523.25,659.25,783.99,1046.5].forEach((f,i)=>tone(f,t+i*.08,.5,'triangle',.3));}
    else{tone(233,t,.45,'sawtooth',.22,220,soft);tone(207,t+.5,1.4,'sawtooth',.22,155,soft);}
  }
  function drumroll(sec){
    if(!soundOn())return;
    const len=ctx.sampleRate*.06,buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);
    const t0=ctx.currentTime;
    for(let t=0;t<sec;t+=.05){const s=ctx.createBufferSource(),g=ctx.createGain(),bp=ctx.createBiquadFilter();
      bp.type='bandpass';bp.frequency.value=900;s.buffer=buf;g.gain.value=.25+.5*(t/sec);s.connect(bp).connect(g).connect(master);s.start(t0+t);}
  }

  /* ---------- 表示切替 ---------- */
  const HOST=/host/.test(location.hash);
  function isPerm(e){return !!e&&/permission/i.test(String(e.code||'')+String(e.message||''));}
  const VIEWS=['vPick','vScreen','vAdmin','vSeat','vVote'];
  function show(id){VIEWS.forEach(v=>$(v).hidden=v!==id);document.body.classList.toggle('display',id==='vScreen');}
  function route(){
    if(!db){show('vPick');return;}
    if(!isOwner){if(HOST){show('vPick');$('switchMode').hidden=true;return;}local.mode='vote';}
    $('switchMode').hidden=!local.mode||!isOwner;
    if(local.mode==='screen'){show('vScreen');$('startWrap').hidden=!!(ctx&&ctx.state==='running');renderScreen(false);}
    else if(local.mode==='admin'){show('vAdmin');renderAdmin();}
    else if(local.mode==='vote'){
      if(local.seat&&local.name){show('vVote');renderVote();}else{show('vSeat');renderSeatPick();}
    }else show('vPick');
  }
  function setMode(m){local.mode=m;saveLocal();route();}
  $('toVote').onclick=()=>setMode('vote');
  $('toScreen').onclick=()=>setMode('screen');
  $('toAdmin').onclick=()=>setMode('admin');
  $('switchMode').onclick=()=>{if(isOwner)setMode(null);};
  $('btnStart').onclick=()=>{ac();$('startWrap').hidden=true;
    try{const el=document.documentElement;(el.requestFullscreen||el.webkitRequestFullscreen||function(){}).call(el);}catch(e){}};
  function leaveScreen(){if(local.mode!=='screen')return;try{if(document.fullscreenElement)document.exitFullscreen();}catch(e){}setMode(null);}
  document.addEventListener('keydown',e=>{if(e.key==='Escape')leaveScreen();});
  $('sRound').addEventListener('dblclick',leaveScreen);
  let lastTap=0;$('sRound').addEventListener('touchend',()=>{const n=Date.now();if(n-lastTap<400)leaveScreen();lastTap=n;});

  /* ---------- 集計 ---------- */
  function seatName(n){const s=seats['s'+n];return s&&s.name?s.name:'';}
  function counts(){
    let f=0,voted=0;SEATS.forEach(n=>{const v=votes['s'+n];if(v==='f'){f++;voted++;}else if(v==='u')voted++;});
    return {f,voted,total:SEATS.filter(n=>seatName(n)).length};
  }
  function isFukai(){return counts().f>=game.thr;}

  /* ---------- 会場スクリーン ---------- */
  const stage=$('stage');
  function renderScreen(animate){
    const c=counts();
    $('sRound').textContent='第'+game.no+'問';
    $('qrWrap').hidden=!game.qr;
    const box=$('seats');box.textContent='';box.classList.toggle('anim',!!animate&&game.phase==='reveal');
    SEATS.forEach(n=>{
      const nm=seatName(n),v=votes['s'+n];
      const el=document.createElement('div');el.className='seat';
      const no=document.createElement('div');no.className='no';no.textContent='席'+n;
      const name=document.createElement('div');name.className='nm';name.textContent=nm||'空席';
      const st=document.createElement('div');st.className='st disp';
      if(!nm&&!v)el.classList.add('empty');
      if(game.phase==='reveal'){
        if(v==='f'){el.classList.add('vf');st.textContent='深イイ';}
        else if(v==='u'){el.classList.add('vu');st.textContent='うーん';}
        else st.textContent='−';
      }else if(v){el.classList.add('done');st.textContent='投票済み';}
      else st.textContent=nm?'考え中…':'';
      el.append(no,name,st);box.appendChild(el);
    });
    const res=$('sResult'),sub=$('sSub');
    if(game.phase==='reveal'){
      const ok=isFukai();
      stage.className='stage '+(ok?'fukai':'uun')+(animate?' anim':'');
      res.textContent=ok?'深イイ':'うーん…';sub.textContent=c.voted+'人中'+c.f+'人が深イイ';
    }else if(game.phase==='tame'){
      stage.className='stage tame';res.textContent='…';sub.textContent='判定は…';
    }else{
      stage.className='stage';res.textContent='？';
      sub.textContent=c.total?('投票 '+c.voted+' / '+c.total+'人'):'参加者を待っています';
    }
  }

  /* ---------- 進行管理 ---------- */
  const PH={voting:'投票受付中',tame:'発表中…',reveal:'結果発表'};
  function renderAdmin(){
    const c=counts();
    $('aRound').textContent='第'+game.no+'問';
    $('aPhase').textContent=PH[game.phase]||'';
    $('aCount').textContent=game.phase==='reveal'
      ?(c.voted+'人中'+c.f+'人が深イイ → '+(isFukai()?'深イイ':'うーん'))
      :('投票 '+c.voted+' / '+c.total+'人');
    $('btnReveal').hidden=game.phase==='reveal';
    $('btnReveal').disabled=game.phase==='tame'&&revealTimer!==null;
    $('btnNext').hidden=game.phase!=='reveal';
    const ul=$('aSeats');ul.textContent='';
    SEATS.forEach(n=>{
      const nm=seatName(n),v=votes['s'+n];
      const li=document.createElement('li');
      const a=document.createElement('span');a.textContent='席'+n+'　'+(nm||'空席');
      const b=document.createElement('span');b.className='s';
      if(game.phase==='reveal')b.textContent=v==='f'?'深イイ':v==='u'?'うーん':'−';
      else if(v){b.textContent='投票済み';b.classList.add('ok');}
      else b.textContent=nm?'考え中…':'';
      li.append(a,b);ul.appendChild(li);
    });
    $('thr').value=String(game.thr);
    setChip('tAuto',game.auto);setChip('tTame',game.tame);setChip('tSound',game.sound);setChip('tQR',game.qr);
  }
  function setChip(id,on){const b=$(id);b.setAttribute('aria-pressed',on);b.textContent=on?'オン':'オフ';}
  function setupThr(){const sel=$('thr');SEATS.forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n+'人以上';sel.appendChild(o);});}
  async function writeGame(patch){
    const next=Object.assign({},game,patch);
    game=next;applyGame();
    try{await db.doc('game').set(next);$('aNote').textContent='操作は会場スクリーンに反映されます。';}
    catch(e){$('aNote').textContent='保存できませんでした。少し待ってからもう一度押してください。';}
  }
  let revealTimer=null,autoTimer=null,autoRid=null;
  function startReveal(){
    if(game.phase==='reveal'||revealTimer)return;
    const rid=game.rid;
    if(game.tame){
      writeGame({phase:'tame'});
      revealTimer=setTimeout(()=>{revealTimer=null;if(game.rid===rid&&game.phase==='tame')writeGame({phase:'reveal'});},1700);
    }else writeGame({phase:'reveal'});
  }
  $('btnReveal').onclick=()=>{
    if(game.phase==='reveal')return;
    if(game.phase==='tame'){clearTimeout(revealTimer);revealTimer=null;writeGame({phase:'reveal'});return;}
    const c=counts();
    if(c.voted<c.total&&!confirm(c.voted===0?'まだ誰も投票していません。発表しますか？':'まだ'+(c.total-c.voted)+'人が投票していません。発表しますか？'))return;
    startReveal();
  };
  $('btnNext').onclick=()=>writeGame({no:game.no+1,rid:'r'+Date.now().toString(36),phase:'voting'});
  $('btnReset').onclick=async()=>{
    if(!confirm('第1問に戻して、席の名前もリセットしますか？'))return;
    for(const n of SEATS){try{await db.doc('seats/s'+n).delete();}catch(e){}}
    writeGame({no:1,rid:'r'+Date.now().toString(36),phase:'voting'});
  };
  $('thr').onchange=e=>writeGame({thr:+e.target.value});
  $('tTame').onclick=()=>writeGame({tame:!game.tame});
  $('tSound').onclick=()=>writeGame({sound:!game.sound});
  $('tQR').onclick=()=>writeGame({qr:!game.qr});
  $('tAuto').onclick=()=>writeGame({auto:!game.auto});
  function checkAuto(){
    if(!isOwner||!game.auto||game.phase!=='voting')return;
    const c=counts();
    if(!(c.total>0&&c.voted>=c.total)){clearTimeout(autoTimer);autoRid=null;return;}
    if(autoRid===game.rid)return;
    autoRid=game.rid;
    autoTimer=setTimeout(()=>{const k=counts();if(game.phase==='voting'&&k.total>0&&k.voted>=k.total)startReveal();},1200);
  }

  /* ---------- 席選び ---------- */
  let pickSeat=local.seat,prevSeat=null;
  const NOPERM='このアカウントには投票の権限がありません。主催者に共有設定を確認してもらってください。';
  function renderSeatPick(){
    const box=$('seatPick');box.textContent='';
    SEATS.forEach(n=>{
      const b=document.createElement('button');b.setAttribute('aria-pressed',pickSeat===n);
      b.textContent='席'+n;const sm=document.createElement('small');sm.textContent=seatName(n)||'空席';b.appendChild(sm);
      b.onclick=()=>{pickSeat=n;renderSeatPick();};box.appendChild(b);
    });
    if(!$('nameIn').value&&local.name)$('nameIn').value=local.name;
    const taken=pickSeat&&seatName(pickSeat)&&seatName(pickSeat)!==$('nameIn').value.trim();
    $('seatWarn').textContent=canWrite===false?NOPERM:taken?'この席は「'+seatName(pickSeat)+'」さんが使っています。参加すると名前が上書きされます。':'';
    $('btnJoin').disabled=!(pickSeat&&$('nameIn').value.trim())||canWrite===false;
  }
  $('nameIn').oninput=renderSeatPick;
  $('btnJoin').onclick=async()=>{
    const name=$('nameIn').value.trim().slice(0,12);if(!pickSeat||!name)return;
    $('btnJoin').disabled=true;
    try{
      await db.doc('seats/s'+pickSeat).set({name});
      if(prevSeat&&prevSeat!==pickSeat){try{await db.doc('seats/s'+prevSeat).delete();}catch(e){}}
      prevSeat=null;local.seat=pickSeat;local.name=name;saveLocal();route();
    }catch(e){
      $('seatWarn').textContent=isPerm(e)?NOPERM:'参加できませんでした。少し待ってからもう一度押してください。';
      $('btnJoin').disabled=false;
    }
  };
  $('changeSeat').onclick=()=>{prevSeat=local.seat;pickSeat=local.seat;local.seat=null;saveLocal();show('vSeat');renderSeatPick();};

  /* ---------- 投票 ---------- */
  function renderVote(){
    const mine=votes['s'+local.seat],open=game.phase==='voting';
    $('meName').textContent='席'+local.seat+'　'+local.name;
    $('vRound').textContent='第'+game.no+'問';
    document.querySelector('.vstage').classList.toggle('closed',!open);
    ['vF','vU'].forEach(id=>{const b=$(id),k=id==='vF'?'f':'u';
      b.setAttribute('aria-pressed',mine===k);b.classList.toggle('dim',!!mine&&mine!==k);b.disabled=!open;});
    const my=mine?'（あなた：'+(mine==='f'?'深イイ':'うーん')+'）':'';
    if(open)$('vStatus').textContent=mine?'投票済み（結果発表までは変更できます）':'深イイか、うーんか。';
    else if(game.phase==='tame')$('vStatus').textContent='結果発表中…'+my;
    else{const c=counts();$('vStatus').textContent=c.voted+'人中'+c.f+'人が深イイ'+my+'。次の回答まで待ってください';}
  }
  async function vote(k){
    if(game.phase!=='voting'||!local.seat)return;
    votes['s'+local.seat]=k;renderVote();
    try{await db.doc('rounds/'+game.rid+'/votes/s'+local.seat).set({v:k});$('vNote').textContent='';}
    catch(e){$('vNote').textContent=isPerm(e)?NOPERM:'送信できませんでした。もう一度押してください。';}
  }
  $('vF').onclick=()=>vote('f');$('vU').onclick=()=>vote('u');

  /* ---------- 購読 ---------- */
  function refresh(animate){
    if(local.mode==='screen'&&!$('vScreen').hidden)renderScreen(animate);
    if(local.mode==='admin'&&!$('vAdmin').hidden)renderAdmin();
    if(local.mode==='vote'){if(!$('vVote').hidden)renderVote();if(!$('vSeat').hidden)renderSeatPick();}
    if(db)checkAuto();
  }
  function subVotes(){
    if(votesRid===game.rid)return;
    if(votesUnsub)votesUnsub();votesRid=game.rid;votes={};
    votesUnsub=db.collection('rounds/'+game.rid+'/votes').onSnapshot(snap=>{
      const v={};snap.docs.forEach(d=>{const x=d.data();if(x&&(x.v==='f'||x.v==='u'))v[d.id]=x.v;});
      votes=v;refresh(false);
    },()=>{});
  }
  // 状態の切り替わりを1か所で検出（自分で書き込んだ場合も演出と音を出す）
  let lastKey=null;
  function applyGame(){
    subVotes();
    const key=game.phase+'|'+game.rid,first=lastKey===null,changed=!first&&key!==lastKey;
    lastKey=key;
    if(changed&&local.mode==='screen'){
      if(game.phase==='tame'){refresh(false);drumroll(1.6);}
      else if(game.phase==='reveal'){refresh(false);setTimeout(()=>{renderScreen(true);play(isFukai()?'fukai':'uun');},250);}
      else refresh(false);
    }else refresh(false);
  }
  function onGame(snap){
    const d=snap.exists?snap.data():{};
    game=Object.assign({},DEF,d||{});
    if(!['voting','tame','reveal'].includes(game.phase))game.phase='voting';
    applyGame();
  }

  async function boot(){
    setupThr();
    if(!FIREBASE_CONFIG||!FIREBASE_CONFIG.apiKey){$('pickMsg').textContent='FIREBASE_CONFIG が未設定です。index.html の設定欄を埋めてください。';return;}
    firebase.initializeApp(FIREBASE_CONFIG);
    const auth=firebase.auth(),R=firebase.database();
    db=makeDb(R);
    // QRは今のURLから作る
    try{const q=qrcode(0,'M');q.addData(location.origin+location.pathname);q.make();$('qrImg').src=q.createDataURL(12,4);}catch(e){}
    $('btnLogin').onclick=async()=>{
      try{await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());}
      catch(e){$('pickMsg').textContent='ログインできませんでした：'+(e.code||e.message);}
    };
    $('btnLogout').onclick=async()=>{await auth.signOut();location.hash='';location.reload();};
    let started=false;
    auth.onAuthStateChanged(async u=>{
      if(!u){try{await auth.signInAnonymously();}catch(e){$('pickMsg').textContent='接続できませんでした：'+(e.code||e.message);}return;}
      isOwner=!!(u.email&&ADMIN_EMAIL&&u.email.toLowerCase()===ADMIN_EMAIL.toLowerCase()&&u.emailVerified);
      canWrite=true;
      $('toVote').hidden=!isOwner;$('toScreen').hidden=!isOwner;$('toAdmin').hidden=!isOwner;
      $('btnLogin').hidden=isOwner||!HOST;$('btnLogout').hidden=!isOwner;
      $('pickMsg').textContent=isOwner?'このスマホ・PCの使い方を選んでください。'
        :(u.email?'このGoogleアカウント（'+u.email+'）は主催者として登録されていません。':'主催者はGoogleでログインしてください。');
      if(!started){
        started=true;
        db.doc('game').onSnapshot(onGame,()=>{});
        db.collection('seats').onSnapshot(snap=>{
          const s={};snap.docs.forEach(d=>{const x=d.data();if(x&&typeof x.name==='string')s[d.id]={name:x.name};});
          seats=s;refresh(false);
        },()=>{});
      }
      route();
    });
  }
  // Realtime Database を doc/collection 風に扱う薄いラッパー
  function makeDb(R){
    return{
      doc(p){const ref=R.ref(p);return{
        set:v=>ref.set(v),delete:()=>ref.remove(),
        onSnapshot(cb,err){const h=s=>cb({exists:s.exists(),data:()=>s.val()});ref.on('value',h,err);return()=>ref.off('value',h);}
      };},
      collection(p){const ref=R.ref(p);return{
        onSnapshot(cb,err){const h=s=>{const docs=[];s.forEach(c=>{docs.push({id:c.key,data:()=>c.val()});});cb({docs});};ref.on('value',h,err);return()=>ref.off('value',h);}
      };}
    };
  }
  boot();
})();

</script>
